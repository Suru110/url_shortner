## render.yaml — Render Blueprint
## https://render.com/docs/blueprint-spec

services:
  - type: web
    name: url-shortener-api
    runtime: node
    region: oregon
    plan: free
    branch: main

    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true

    envVars:
      # ── Required secrets — set in the Render dashboard (Environment tab) ──────
      - key: MONGODB_URI
        sync: false        # mongodb+srv://<user>:<pass>@cluster.mongodb.net/urlshortener?retryWrites=true&w=majority

      - key: JWT_SECRET
        sync: false        # any long random string, e.g.: openssl rand -hex 32

      # ── Non-secret config ─────────────────────────────────────────────────────
      - key: NODE_ENV
        value: production

      - key: PORT
        value: "10000"

      - key: BASE_URL
        value: https://url-shortner-98eu.onrender.com

      - key: CORS_ORIGIN
        value: https://url-shortner-98eu.onrender.com
